services:
    whatsapp-chatgpt:
        build: .
        image: whatsapp-chatgpt:latest
        container_name: whatsapp-chatgpt
        init: true
        env_file:
            - .env
        environment:
            SESSION_PATH: /app/session
        restart: unless-stopped
        volumes:
            - session-data:/app/session

volumes:
    session-data:
